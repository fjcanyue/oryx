[toolchain]
# One compiler for every build of a release: the host, the Ubuntu root and
# the Mac runner install this version by themselves. It moves at the
# opening of a phase, on the maintainer's word.
channel = "1.99.0"
components = ["clippy", "rustfmt"]
# The two cross targets of `make check` and of the Windows build, so a
# fresh checkout has them.
targets = ["x86_64-pc-windows-gnu", "aarch64-apple-darwin"]
