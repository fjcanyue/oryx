[workspace]
members = ["noad", "palmbook", "rarball"]

[package]
name = "oryx"
version = "1.1.1"
description = "Fast editor for markdown and code, reader for ebooks and comics"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/wmahfoudh/oryx"
# Merman 0.7 (edition 2024) sets the floor; Oryx itself stays on 2021.
rust-version = "1.95"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
cosmic-text = "0.17.0"
directories = "6"
fancy-regex = "0.16.2"
# Workspace search: the walk, the fuzzy matcher and the grep stack,
# ripgrep's own traversal and search crates behind a small module.
grep-matcher = "0.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
html5ever = "0.39"
ignore = "0.4.33"
markup5ever_rcdom = "0.39"
# SVG output only: the default features pull the `mmdc`-style CLI (clap)
# and a PNG rasterizer (resvg/usvg) Oryx already has its own copy of.
# The diagram renderer: parity-oriented Mermaid, SVG out. `render` only
# — `raster` would drag a second resvg/usvg stack in beside Oryx's own.
merman = { version = "=0.7.0", default-features = false, features = ["render"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "rayon"] }
miniz_oxide = "0.8"
noad = { path = "noad" }
nucleo-matcher = "0.3.1"
open = "5"
palmbook = { path = "palmbook" }
rarball = { path = "rarball" }
pdf-writer = "0.15"
pulldown-cmark = "0.13"
resvg = "0.45.1"
roxmltree = "0.20"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
subsetter = "0.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiny-skia = "0.11"
toml = "0.8"
ttf-parser = "0.25"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "gzip"] }
winit = "0.30"
zip = { version = "4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "rayon"] }
lopdf = "0.44"

[build-dependencies]
ico = "0.5.0"
resvg = "0.45.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

# File drops on Wayland, which winit 0.30 leaves out; both crates are
# already in the tree through winit, at the same versions.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
